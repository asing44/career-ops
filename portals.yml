    notes: "Digital agency. Frontend, Webflow, WordPress, CMS roles."
    enabled: true

  - name: 10up
    careers_url: https://fueled.com/careers
    scan_method: websearch
    scan_query: '"fueled" careers "engineer" OR "developer" OR "frontend"'
    notes: "WordPress agency (rebranded to Fueled, 2025). Remote-first, mid-level friendly."
    enabled: true

  - name: Youghal Digital
    careers_url: https://youghaldigital.com/careers
    scan_method: websearch
    scan_query: '"youghal digital" careers OR jobs'
    notes: "Webflow agency. Client-facing frontend. Domain does not resolve (2026-08) — disabled pending rebrand/reappearance."
