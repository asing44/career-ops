# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.

# -- Location filter --
location_filter:
  always_allow:
    - "United States"
    - "Remote"
  allow:
    - "Remote"
    - "Raleigh"
    - "North Carolina"
    - "United States"
    - "USA"
  block:
    - "India"
    - "Bengaluru"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "France"
    - "Singapore"
    - "Poland"
    - "Warszawa"
    - "Canada"
    - "Toronto"
    - "Brazil"
    - "Portugal"
    - "Spain"
    - "Sweden"
    - "Stockholm"
    - "Denmark"
    - "Israel"

# -- Salary filter --
salary_filter:
  min: 50000
  max: 100000
  currency: "USD"

# -- Title filter --
title_filter:
  positive:
    # -- Webflow & WordPress --
    - "Webflow Developer"
    - "Webflow Designer"
    - "Webflow"
    - "WordPress Developer"
    - "WordPress"
    - "CMS Developer"
    # -- Frontend (mid/junior) --
    - "Frontend Developer"
    - "Front-End Developer"
    - "Junior Frontend"
    - "Jr Frontend"
    - "Web Developer"
    - "Website Developer"
    - "UI Developer"
    # -- Solutions & implementation --
    - "Solutions Developer"
    - "Solutions Consultant"
    - "Implementation Developer"
    - "Implementation Consultant"
    - "Implementation Specialist"
    - "Technical Implementation"
    - "Technical Consultant"
    - "Application Developer"
    # -- Creative / entry-friendly --
    - "Creative Developer"
    - "Experience Developer"
    - "Digital Experience"
    - "Associate Developer"
    # -- Entry-level & internship --
    - "Junior Developer"
    - "Jr Developer"
    - "Happiness Engineer"
    - "Support Engineer"
    - "Technical Account Manager"
    # -- AI integration (practical, not engineer-level) --
    - "AI Integration"
    - "AI Solutions"
    - "Automation Developer"
    - "Workflow Developer"
  negative:
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Mainframe"
    - "COBOL"
    - "Pre-Sales"
    - "Presales"
    - "Sales Engineer"
    - "Sales Director"
    - "Sales Executive"
    - "Account Executive"
    - "Partner Engineer"
    - "Channel"
    - "Manager"
    - "Director"
    - "VP"
    - "Vice President"
    - "Head of"
    - "Architect"
    - "Customer Success"
    - "Robotics"
    - "RTL "
    - "Chip "
    - "Circuit "
    - "Analog "
    - "RF "
    - "Hardware "
    - "Mechanical "
    - "Structural "
    - "Civil "
    - "Aerospace"
    - "Avionics"
    - "Defense"
    - "Security Clearance"
    - "TS/SCI"
    - "Biotech"
    - "Pharma"
    - "Clinical"
    - "Controls "
    - "Automation Engineer"
    - "DevOps"
    - "SRE "
    - "Site Reliability"
    - "Data Engineer"
    - "Data Scientist"
    - "ML Engineer"
    - "MLOps"
    - "DevRel"
    - "Developer Advocate"
    - "Principal"
    - "Staff "
    - "Senior Frontend"
    - "Senior Front-End"
    - "Senior Engineer"
    - "Lead Engineer"
    - "Senior Web"
    - "Senior Developer"
    - "Senior WordPress"
  seniority_boost: []

# -- Search queries --
search_queries:
  # -- Webflow jobs --
  - name: Webflow — All
    query: 'site:webflow.com/jobs OR site:webflow.com/careers OR site:webflow-experts.com "Webflow Developer" OR "Webflow Designer"'
    enabled: true

  - name: RemoteOK — Webflow & WordPress
    query: 'site:remoteok.com "Webflow" OR "WordPress" OR "CMS" remote'
    enabled: true

  - name: WeWorkRemotely — Frontend & Web
    query: 'site:weworkremotely.com "Frontend" OR "Web Developer" OR "Webflow" OR "WordPress" OR "Junior" remote'
    enabled: true

  # -- General frontend & web (remote US) --
  - name: Greenhouse — Frontend & Web (US)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Frontend Developer" OR "Web Developer" OR "WordPress Developer" OR "Webflow" remote United States'
    enabled: true

  - name: Ashby — Frontend & Implementation
    query: 'site:jobs.ashbyhq.com "Frontend Developer" OR "Implementation Consultant" OR "Solutions Consultant" OR "Web Developer" remote'
    enabled: true

  - name: Lever — Frontend & Solutions
    query: 'site:jobs.lever.co "Frontend Developer" OR "Implementation" OR "Solutions Consultant" OR "Junior" remote'
    enabled: true

  # -- Implementation & solutions roles --
  - name: Implementation Consultant — All portals
    query: '"Implementation Consultant" OR "Implementation Specialist" OR "Technical Implementation" "Remote" OR "United States"'
    enabled: true

  - name: Solutions Consultant — All portals
    query: '"Solutions Consultant" OR "Solutions Developer" OR "Application Developer" "Remote" OR "United States"'
    enabled: true

  # -- WordPress specific --
  - name: WordPress Jobs — WPHired
    query: 'site:wphired.com remote OR "United States" OR "North Carolina"'
    enabled: true

  - name: WordPress — All portals
    query: '"WordPress Developer" OR "WordPress Engineer" site:boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co remote'
    enabled: true

  # -- Junior / entry-level friendly --
  - name: Junior Developer — All portals
    query: '"Junior Frontend" OR "Jr Frontend" OR "Junior Developer" OR "Associate Developer" frontend OR web site:boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co remote'
    enabled: true

  # -- Remote-friendly boards --
  - name: Himalayas — Frontend & Web
    query: 'site:himalayas.app "Frontend" OR "Web Developer" OR "Junior" OR "WordPress" remote United States'
    enabled: true

  - name: Working Nomads — Web & Frontend
    query: 'site:workingnomads.com "Frontend" OR "Web" OR "WordPress" OR "Implementation" remote'
    enabled: true

  - name: Remote Rocketship — Frontend
    query: 'site:remoterocketship.com "Frontend" OR "Web Developer" OR "Junior" remote'
    enabled: true

  # -- Local (Raleigh / North Carolina) --
  - name: Built In — Raleigh Tech
    query: 'site:builtin.com/companies "Raleigh" OR "North Carolina" OR "NC" "Frontend" OR "Web" OR "Developer" OR "Implementation" OR "Solutions"'
    enabled: true

  - name: Indeed — Raleigh Frontend
    query: 'site:indeed.com "Frontend" OR "Web Developer" OR "WordPress" OR "Implementation" Raleigh OR "North Carolina"'
    enabled: true

  # -- Y Combinator / startup roles (entry-friendly) --
  - name: YC Jobs — Frontend & Early Roles
    query: 'site:workatastartup.com "Frontend" OR "Web Developer" OR "Implementation" OR "Junior" remote United States'
    enabled: true

# -- Tracked companies --
tracked_companies:

  # -- Webflow ecosystem --
  - name: Webflow
    careers_url: https://webflow.com/jobs
    api: https://boards-api.greenhouse.io/v1/boards/webflow/jobs
    notes: "Webflow platform itself. Frontend, solutions, support."
    enabled: true

  - name: Finsweet
    careers_url: https://finsweet.com/jobs/home
    scan_method: websearch
    scan_query: '"finsweet" careers OR jobs'
    notes: "Webflow development agency. Client-facing frontend."
    enabled: true

  # -- WordPress ecosystem --
  - name: Automattic
    careers_url: https://automattic.com/work-with-us
    scan_method: websearch
    scan_query: 'site:automattic.com/work-with-us OR "automattic" "WordPress" engineer site:jobs.lever.co'
    notes: "WordPress.com, WooCommerce. Remote-first, mid-level friendly."
    enabled: true

  - name: WP Engine
    careers_url: https://wpengine.com/careers
    scan_method: websearch
    scan_query: '"wp engine" careers "engineer" OR "developer" OR "solutions"'
    notes: "WordPress hosting. Remote-friendly HQ in Austin."
    enabled: true

  - name: Elementor
    careers_url: https://elementor.com/careers
    scan_method: websearch
    scan_query: 'site:elementor.com/careers OR "elementor" careers OR jobs site:boards.greenhouse.io'
    notes: "WordPress page builder. Frontend, support, solutions."
    enabled: true

  # -- Enterprise platforms (implementation/solutions) --
  - name: HubSpot
